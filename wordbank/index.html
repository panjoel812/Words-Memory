<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词库 - Words Memory</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/desktop.css" media="(min-width: 1024px)">
    <link rel="stylesheet" href="../css/mobile.css" media="(max-width: 767px)">
    <link rel="stylesheet" href="../css/wordbank.css">
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app">
        <!-- 应用主界面 -->
        <div class="app-container" id="appContainer">
            <!-- 顶部导航栏 -->
            <nav class="top-nav glass-effect" id="topNav">
                <div class="top-nav__logo">
                    <a href="../index.html">
                        <img src="../assets/images/logo.svg" alt="Words Memory Logo">
                        <h1>Words Memory</h1>
                    </a>
                </div>
                <div class="top-nav__menu">
                    <a href="../index.html" class="top-nav__menu-item">首页</a>
                    <a href="../wordbank/" class="top-nav__menu-item active">词库</a>
                    <a href="../study/" class="top-nav__menu-item">背单词</a>
                    <a href="../review/" class="top-nav__menu-item">复习</a>
                    <a href="../stats/" class="top-nav__menu-item">成就</a>
                    <a href="../settings/" class="top-nav__menu-item">设置</a>
                </div>
                <div class="top-nav__actions">
                    <div class="top-nav__search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="搜索单词...">
                    </div>
                    <div class="top-nav__user">
                        <div class="top-nav__user-avatar">张</div>
                    </div>
                </div>
            </nav>

            <!-- 主内容区域 -->
            <main class="main-content" id="mainContent">
                <!-- 词库页面 -->
                <div class="wordbank-page" id="wordBankPage">
                    <h2 class="page-title">我的词库</h2>
                    
                    <!-- 词库操作按钮 -->
                    <div class="wordbank-actions glass-effect">
                        <button class="btn btn-primary" id="createWordListBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            创建词库
                        </button>
                        <button class="btn btn-secondary" id="importFromEudictBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            从欧路词典导入
                        </button>
                        <button class="btn btn-secondary" id="importJsonBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            导入JSON
                        </button>
                    </div>
                    
                    <!-- 欧路词典导入模态框 -->
                    <div class="modal" id="eudictModal">
                        <div class="modal-content glass-effect">
                            <div class="modal-header">
                                <h3>从欧路词典导入</h3>
                                <button class="modal-close" id="closeEudictModal">&times;</button>
                            </div>
                            <div class="modal-body">
                                <p>选择要导入的欧路词典生词本分类：</p>
                                <div class="eudict-categories" id="eudictCategories">
                                    <div class="loading-spinner">加载中...</div>
                                </div>
                                <div class="form-group">
                                    <label for="newWordListName">新词库名称</label>
                                    <input type="text" id="newWordListName" placeholder="欧路词典生词" class="form-control">
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" id="cancelEudictImport">取消</button>
                                <button class="btn btn-primary" id="confirmEudictImport">导入</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 词库列表 -->
                    <div class="wordlists-container" id="wordListsContainer">
                        <div class="loading-indicator" id="wordListsLoading">
                            <div class="spinner"></div>
                            <p>正在加载词库...</p>
                        </div>
                        
                        <div class="wordlists" id="wordLists">
                            <!-- 词库列表由JS动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 词库模板 -->
                    <template id="wordListTemplate">
                        <div class="wordlist-card glass-effect">
                            <div class="wordlist-info">
                                <h3 class="wordlist-name">初级英语</h3>
                                <p class="wordlist-description">包含1000个最常用的英语单词</p>
                                <div class="wordlist-stats">
                                    <span class="wordlist-count">1000个单词</span>
                                    <span class="wordlist-mastered">已掌握: 0</span>
                                </div>
                                <div class="wordlist-tags">
                                    <span class="tag">英语</span>
                                    <span class="tag">基础</span>
                                </div>
                            </div>
                            <div class="wordlist-actions">
                                <button class="btn btn-primary btn-sm wordlist-study-btn">开始学习</button>
                                <div class="wordlist-menu">
                                    <button class="btn-icon wordlist-menu-toggle">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                                    </button>
                                    <div class="wordlist-menu-dropdown">
                                        <a href="#" class="wordlist-menu-item edit-wordlist">编辑</a>
                                        <a href="#" class="wordlist-menu-item export-wordlist">导出</a>
                                        <a href="#" class="wordlist-menu-item delete-wordlist">删除</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </main>

            <!-- 底部导航栏 (移动端) -->
            <nav class="mobile-nav" id="mobileNav">
                <a href="../index.html" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>首页</span>
                </a>
                <a href="../wordbank/" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    <span>词库</span>
                </a>
                <a href="../study/" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    <span>背单词</span>
                </a>
                <a href="../review/" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>复习</span>
                </a>
                <a href="../stats/" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    <span>成就</span>
                </a>
            </nav>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/wordBank.js"></script>
    <script src="../js/memorySystem.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/wordBankManager.js"></script>
</body>
</html>
